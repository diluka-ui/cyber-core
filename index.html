<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Core | Cyber Security Data Base</title>

<meta name="description"
      content="Cyber Core is a secure cyber security data platform for managing protected files, account security, login history and digital security resources.">

<meta name="application-name" content="Cyber Core">
<meta name="theme-color" content="#0b0f0b">
<meta name="robots" content="index, follow">
<meta name="google-site-verification"
      content="V8brM0on6J73A5A85WVPk4rG6wxfj22fjNIJQnB0fI0">

<link rel="canonical" href="https://diluka-ui.github.io/cyber-core/">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="manifest" href="./manifest.json">

<meta property="og:title"
      content="Cyber Core | Cyber Security Data Base">
<meta property="og:description"
      content="Cyber Core - Future Cyber Security Data Base">
<meta property="og:image"
      content="https://diluka-ui.github.io/cyber-core/cyber-core-logo.jpg">
<meta property="og:url"
      content="https://diluka-ui.github.io/cyber-core/">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary">
<meta name="twitter:title"
      content="Cyber Core | Cyber Security Data Base">
<meta name="twitter:description"
      content="Cyber Core - Future Cyber Security Data Base">
<meta name="twitter:image"
      content="https://diluka-ui.github.io/cyber-core/cyber-core-logo.jpg">

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"WebSite",
  "name":"Cyber Core",
  "alternateName":"Cyber Security Data Base",
  "url":"https://diluka-ui.github.io/cyber-core/",
  "description":"Secure cyber security data platform for protected storage, account security and digital security resources."
}
</script>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@400;600;700;900&family=Oxanium:wght@400;600;700&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=VT323&display=swap"
      rel="stylesheet">
</head>

<body>

<audio id="backgroundMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<!-- LOGIN / REGISTER -->
<div id="authContainer">

  <div id="loginBox">
    <h1>CYBER CORE</h1>
    <p>Cyber Security Data Base</p>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPhone" type="tel" placeholder="Phone Number">
    <input id="loginPassword" type="password" placeholder="Password">

    <div class="h-captcha"
         data-sitekey="YOUR_HCAPTCHA_SITE_KEY">
    </div>

    <button id="loginBtn">LOGIN</button>

    <div class="social-login">
      <button id="googleLoginBtn">CONTINUE WITH GOOGLE</button>
      <button id="githubLoginBtn">CONTINUE WITH GITHUB</button>
    </div>

    <button id="createAccountBtn">CREATE NEW ACCOUNT</button>

    <div id="message"></div>
  </div>

  <!-- REGISTER -->
  <div id="registerBox" style="display:none;">
    <h1>CREATE ACCOUNT</h1>

    <input id="email" type="email" placeholder="Email">
    <input id="phone" type="tel" placeholder="Phone Number">

    <div class="h-captcha"
         data-sitekey="YOUR_HCAPTCHA_SITE_KEY">
    </div>

    <button id="sendBtn">SEND OTP</button>
  </div>

  <!-- OTP -->
  <div id="otpBox" style="display:none;">
    <h1>VERIFY OTP</h1>

    <div class="otp-container">
      <input id="otp1" maxlength="1">
      <input id="otp2" maxlength="1">
      <input id="otp3" maxlength="1">
      <input id="otp4" maxlength="1">
      <input id="otp5" maxlength="1">
      <input id="otp6" maxlength="1">
    </div>

    <input id="otp" type="hidden">

    <button id="verifyBtn">VERIFY OTP</button>
  </div>

  <!-- PASSWORD -->
  <div id="passwordBox" style="display:none;">
    <h1>CREATE PASSWORD</h1>

    <input id="newPassword"
           type="password"
           placeholder="New Password">

    <input id="confirmPassword"
           type="password"
           placeholder="Confirm Password">

    <button id="savePasswordBtn">SAVE PASSWORD</button>
  </div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

  <div id="dashboard-badge">
    CYBER CORE
  </div>

  <button id="securityMenuButton">
    SECURITY
  </button>

  <!-- HOME -->
  <section id="homePage" class="dashboard-page">

    <div class="dashboard-card">
      <h2>DATA BASE</h2>
      <p>Secure Cyber Security Data Base</p>
    </div>

    <div class="dashboard-card">
      <h2>LOGIN HISTORY</h2>
      <div id="loginHistoryList"></div>
    </div>

    <!-- SYSTEM TOURTRIAL VIDEO (hidden player, title only) -->
    <div class="dashboard-card">
      <h2>SYSTEM TOURTRIAL VIDEO</h2>

      <video id="loginVideo"
             controls
             playsinline
             style="width:100%;">
        <source src="login video.mp4" type="video/mp4">
      </video>
    </div>

    <div class="dashboard-card">
      <h2>CHANGE PASSWORD</h2>
      <button id="changePasswordBtn">
        CHANGE PASSWORD
      </button>
    </div>

    <div class="dashboard-card">
      <h2>STORAGE</h2>
      <div id="storageInfo"></div>
    </div>

  </section>


  <!-- SEARCH -->
  <section id="searchPage"
           class="dashboard-page"
           style="display:none;">

    <h2>SEARCH</h2>

    <input id="searchQueryInput"
           type="text"
           placeholder="Search files...">

    <div id="searchResultsList"></div>

  </section>


  <!-- ADD -->
  <section id="addPage"
           class="dashboard-page"
           style="display:none;">

    <h2>ADD DATA</h2>

    <input id="fileInput"
           type="file">

    <input id="fileTitle"
           type="text"
           placeholder="File Title">

    <input id="fileCategory"
           type="text"
           placeholder="Category">

    <button id="addFileBtn">
      ADD FILE
    </button>

    <div id="savedFilesList"></div>

  </section>


  <!-- SETTINGS -->
  <section id="settingsPage"
           class="dashboard-page"
           style="display:none;">

    <h2>SETTINGS</h2>

    <button id="logoutBtn">
      LOGOUT
    </button>

    <button id="removeAccountBtn">
      REMOVE ACCOUNT
    </button>

  </section>


  <!-- PROFILE -->
  <section id="profilePage"
           class="dashboard-page"
           style="display:none;">

    <h2>PROFILE</h2>

    <div id="profilePictureContainer">
      <img id="profilePicture"
           src=""
           alt="Profile">
    </div>

    <input id="profileName"
           type="text"
           placeholder="Name">

    <input id="profileBirthday"
           type="date">

    <textarea id="profileBio"
              placeholder="Bio"></textarea>

    <input id="profilePictureInput"
           type="file"
           accept="image/*">

    <button id="saveProfileBtn">
      SAVE PROFILE
    </button>

    <div id="accountSwitcher"></div>

  </section>


  <!-- MAGIC NAVIGATION -->
  <nav id="magicNav">

    <button id="homeNavBtn">
      <img src="home.png" alt="Home">
    </button>

    <button id="searchNavBtn">
      <img src="search.png" alt="Search">
    </button>

    <button id="addNavBtn">
      <img src="add.png" alt="Add">
    </button>

    <button id="settingsNavBtn">
      <img src="setting.png" alt="Settings">
    </button>

    <button id="profileNavBtn">
      <img src="profile.png" alt="Profile">
    </button>

  </nav>

</div>


<!-- SECURITY CENTER -->
<div id="securityCenter"
     style="display:none;">

  <div id="securityCenterContent">

    <h2>SECURITY CENTER</h2>

    <div id="securityStatus"></div>

    <div id="securityActivity"></div>

    <div id="securityActions"></div>

    <button id="closeSecurityCenter">
      CLOSE
    </button>

  </div>

</div>


<!-- HCAPTCHA -->
<script src="https://js.hcaptcha.com/1/api.js"
        async
        defer></script>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CYBER CORE SCRIPT -->
<script src="script.js?v=3"></script>

</body>
</html>
